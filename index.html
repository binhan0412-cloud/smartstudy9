
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartStudy 9</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0f5ff;
      color: #183153;
    }
    .container {
      max-width: 650px;
      margin: 70px auto;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: white;
      border-radius: 18px;
      padding: 35px 22px;
      box-shadow: 0 8px 25px #00000012;
    }
    h1 { color: #2457c5; }
    p { line-height: 1.7; }
    .button {
      display: inline-block;
      padding: 14px 25px;
      margin-top: 15px;
      border-radius: 10px;
      background: #2457c5;
      color: white;
      font-weight: bold;
    }
    .note {
      margin-top: 20px;
      font-size: 13px;
      color: #65758b;
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="card">
      <h1>SmartStudy 9</h1>
      <h2>Học thông minh - Tiến bộ mỗi ngày</h2>
      <p>
        Ứng dụng hỗ trợ học sinh lớp 9
        ôn tập kiến thức, luyện bài tập
        và theo dõi tiến bộ học tập.
      </p>
      <p><strong>Toán 9 - Kết nối tri thức với cuộc sống</strong></p>
      <div class="button">Đăng nhập Google - Sắp ra mắt</div>
      <p class="note">
        Phiên bản giao diện thử nghiệm.
        Chưa kết nối tài khoản hoặc dữ liệu học sinh.
      </p>
    </div>
  </main>
</body>
</html>
